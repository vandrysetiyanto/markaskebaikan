<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — Admin Markas Kebaikan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46' },
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-white to-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md animate-in">

        <!-- LOGO -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-white shadow-lg flex items-center justify-center mx-auto mb-4 overflow-hidden">
                <img src="assets/MK.ico" alt="Markas Kebaikan" class="w-12 h-12 object-contain">
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900">Admin <span class="text-emerald-600">Markas Kebaikan</span></h1>
            <p class="text-sm text-slate-500 mt-1">Masuk untuk mengelola kampanye & donasi</p>
        </div>

        <!-- LOGIN CARD -->
        <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-8">

            <!-- Error Alert -->
            <div id="loginError" class="hidden mb-4 bg-red-50 border border-red-200 text-red-700 text-sm font-medium px-4 py-3 rounded-xl flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="loginErrorMessage">Username atau password salah!</span>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">

                <!-- Username -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">
                        <i class="fa-regular fa-user mr-1"></i> Username
                    </label>
                    <input type="text" id="loginUsername" placeholder="Masukkan username admin" required
                           class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none focus:border-emerald-500 transition"
                           autocomplete="username">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">
                        <i class="fa-solid fa-lock mr-1"></i> Password
                    </label>
                    <div class="relative">
                        <input type="password" id="loginPassword" placeholder="Masukkan password" required
                               class="w-full px-4 py-3 pr-12 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none focus:border-emerald-500 transition"
                               autocomplete="current-password">
                        <button type="button" onclick="togglePassword()"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-emerald-600 transition p-1">
                            <i id="passwordIcon" class="fa-regular fa-eye text-lg"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" id="loginBtn"
                        class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/25 hover:shadow-xl transition-all duration-200 text-sm">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i> Masuk ke Dashboard
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-100 text-center">
                <a href="index.html" class="text-sm text-slate-400 hover:text-slate-600 transition font-medium">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Beranda
                </a>
            </div>
        </div>

        <!-- FOOTER -->
        <p class="text-center text-xs text-slate-400 mt-8">
            &copy; 2026 Markas Kebaikan. Hanya untuk admin.
        </p>
    </div>

    <script>
        // Proteksi: jika sudah login, redirect langsung ke dashboard
        (function() {
            if (sessionStorage.getItem('mk_admin_logged_in') === 'true') {
                window.location.href = 'admin.html';
            }
        })();

        function togglePassword() {
            var pw = document.getElementById('loginPassword');
            var icon = document.getElementById('passwordIcon');
            if (pw.type === 'password') {
                pw.type = 'text';
                icon.className = 'fa-regular fa-eye-slash text-lg';
            } else {
                pw.type = 'password';
                icon.className = 'fa-regular fa-eye text-lg';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            
            var username = document.getElementById('loginUsername').value.trim();
            var password = document.getElementById('loginPassword').value.trim();
            var errorEl = document.getElementById('loginError');
            var errorMsg = document.getElementById('loginErrorMessage');
            var btn = document.getElementById('loginBtn');

            // Credentials default (sama seperti sebelumnya)
            var validUsername = 'admin';
            var validPassword = 'markaskebaikan123';

            if (username === validUsername && password === validPassword) {
                // Login berhasil
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Memproses...';

                sessionStorage.setItem('mk_admin_logged_in', 'true');
                
                setTimeout(function() {
                    window.location.href = 'admin.html';
                }, 500);
            } else {
                // Login gagal
                errorEl.classList.remove('hidden');
                errorMsg.textContent = 'Username atau password tidak sesuai!';
                document.getElementById('loginPassword').value = '';
                document.getElementById('loginPassword').focus();
            }
        }
    </script>
</body>
</html>
